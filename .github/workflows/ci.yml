name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: PSScriptAnalyzer and Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          # The same versions as tests/Invoke-Checks.ps1 was last run with locally
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run checks
        shell: pwsh
        run: ./tests/Invoke-Checks.ps1
